apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ingress
  namespace: nginx
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.allow-http: "true"
    # Use your reserved static IP name if you have one (recommended)
    kubernetes.io/ingress.global-static-ip-name: nginx
    cert-manager.io/issuer: letsencrypt-staging
spec:
  tls:
    - secretName: web-ssl
      hosts:
        - api.hexelstudio.com
  defaultBackend:
    service:
      name: nginx-service
      port:
        number: 80
