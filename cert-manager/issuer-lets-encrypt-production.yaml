# issuer-lets-encrypt-production.yaml
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: letsencrypt-production
  namespace: nginx
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: khushwantsanwalot2004@outlook.com
    profile: tlsserver
    privateKeySecretRef:
      name: letsencrypt-production
    solvers:
    - http01:
        ingress:
          name: nginx-ingress